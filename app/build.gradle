plugins {
    id 'com.android.application'
}

android {
    namespace 'com.androidopenbot.wechat.picker'
    compileSdk 35

    defaultConfig {
        applicationId "com.androidopenbot.wechat.picker"
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            excludes += [
                    'META-INF/INDEX.LIST',
                    'META-INF/*.SF',
                    'META-INF/*.DSA',
                    'META-INF/*.RSA',
                    'META-INF/DEPENDENCIES',
                    'META-INF/LICENSE',
                    'META-INF/LICENSE.txt',
                    'META-INF/LICENSE.md',
                    'META-INF/NOTICE',
                    'META-INF/NOTICE.txt',
                    'META-INF/NOTICE.md',
                    'META-INF/AL2.0',
                    'META-INF/LGPL2.1'
            ]
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    compileOnly files('libs/api-82.jar')
    compileOnly 'org.jetbrains.kotlin:kotlin-stdlib:1.5.0'
    implementation 'org.luckypray:dexkit:2.3.0'
    testImplementation 'junit:junit:4.13.2'
}
