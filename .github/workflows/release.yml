name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'app/build.gradle'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  XPOSED_REPO: Xposed-Modules-Repo/io.github.Jackyhu32.wechat.picker
  APK_NAME: WeChatSysPicker-debug.apk

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      version_name: ${{ steps.ver.outputs.name }}
      main_tag: ${{ steps.ver.outputs.main_tag }}
      xposed_tag: ${{ steps.ver.outputs.xposed_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read version from app/build.gradle
        id: ver
        run: |
          set -euo pipefail
          VC="$(grep -oP 'versionCode\s+\K[0-9]+' app/build.gradle)"
          VN="$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)"
          echo "versionCode=$VC  versionName=$VN"
          {
            echo "code=$VC"
            echo "name=$VN"
            echo "main_tag=v${VN}"
            echo "xposed_tag=${VC}-${VN}"
          } >> "$GITHUB_OUTPUT"

      - name: Verify tag matches versionName
        if: github.ref_type == 'tag'
        env:
          EXPECTED: ${{ steps.ver.outputs.main_tag }}
        run: |
          set -euo pipefail
          echo "pushed tag : ${GITHUB_REF_NAME}"
          echo "expected   : ${EXPECTED}"
          if [ "${GITHUB_REF_NAME}" != "${EXPECTED}" ]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not match versionName; expected '${EXPECTED}'."
            exit 1
          fi

      - name: Decide whether to publish
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAIN_TAG: ${{ steps.ver.outputs.main_tag }}
          XPOSED_TAG: ${{ steps.ver.outputs.xposed_tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "::notice::Triggered by tag ${GITHUB_REF_NAME}"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          main_ok=false
          xposed_ok=false
          if gh release view "$MAIN_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            main_ok=true
          fi
          if gh release view "$XPOSED_TAG" --repo "$XPOSED_REPO" >/dev/null 2>&1; then
            xposed_ok=true
          fi

          if [ "$main_ok" = true ] && [ "$xposed_ok" = true ]; then
            echo "::notice::Version ${MAIN_TAG} is already released in both repos, skipping."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::New version ${MAIN_TAG} detected, publishing (main=${main_ok}, xposed=${xposed_ok})."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      VN: ${{ needs.gate.outputs.version_name }}
      MAIN_TAG: ${{ needs.gate.outputs.main_tag }}
      XPOSED_TAG: ${{ needs.gate.outputs.xposed_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate preinstalled Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "::error::Android SDK not found on this runner."
            exit 1
          fi
          echo "Using ANDROID_HOME=$SDK"
          {
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
          } >> "$GITHUB_ENV"

      - name: Ensure SDK components
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME}"
          need=()
          [ -d "$SDK/platforms/android-35" ] || need+=("platforms;android-35")
          [ -d "$SDK/build-tools/35.0.0" ] || need+=("build-tools;35.0.0")
          if [ "${#need[@]}" -eq 0 ]; then
            echo "Required SDK components already installed."
            exit 0
          fi
          SDKM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1 || true)"
          if [ -z "$SDKM" ]; then
            echo "::warning::sdkmanager not found; relying on Gradle auto-download."
            exit 0
          fi
          echo "Installing: ${need[*]}"
          yes | "$SDKM" "${need[@]}" >/dev/null

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Stage APK
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK" || { echo "::error::APK not produced"; exit 1; }
          cp "$APK" "$APK_NAME"
          ls -l "$APK_NAME"

      - name: Release on main repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$MAIN_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $MAIN_TAG exists, replacing asset"
            gh release upload "$MAIN_TAG" "$APK_NAME" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$MAIN_TAG" "$APK_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --target main \
              --title "$VN" \
              --generate-notes
          fi

      - name: Sync main branch to Xposed repo
        env:
          XPOSED_PAT: ${{ secrets.XPOSED_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${XPOSED_PAT:-}" ]; then
            echo "::error::Secret XPOSED_PAT is not configured for this repository."
            exit 1
          fi
          # actions/checkout persists a GITHUB_TOKEN extraheader that takes
          # precedence over any credentials embedded in a remote URL.
          git config --local --unset-all 'http.https://github.com/.extraheader' || true
          AUTH="$(printf 'x-access-token:%s' "${XPOSED_PAT}" | base64 -w0)"
          git fetch origin "+refs/heads/main:refs/remotes/origin/main"
          git remote remove xposed 2>/dev/null || true
          git remote add xposed "https://github.com/${XPOSED_REPO}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH}" \
            push xposed refs/remotes/origin/main:refs/heads/main

      - name: Release on Xposed repo
        env:
          GH_TOKEN: ${{ secrets.XPOSED_PAT }}
        run: |
          set -euo pipefail
          if gh release view "$XPOSED_TAG" --repo "$XPOSED_REPO" >/dev/null 2>&1; then
            echo "Release $XPOSED_TAG exists, replacing asset"
            gh release upload "$XPOSED_TAG" "$APK_NAME" --repo "$XPOSED_REPO" --clobber
            echo "::warning::Asset replaced on an existing release. XposedBot does not rescan on asset-only changes - edit the release notes to trigger it."
          else
            gh release create "$XPOSED_TAG" "$APK_NAME" \
              --repo "$XPOSED_REPO" \
              --target main \
              --title "$VN" \
              --generate-notes
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### Release ${VN}"
            echo ""
            echo "- main repo: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${MAIN_TAG}"
            echo "- Xposed   : https://github.com/${XPOSED_REPO}/releases/tag/${XPOSED_TAG}"
          } >> "$GITHUB_STEP_SUMMARY"
